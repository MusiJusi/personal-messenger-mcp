[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-messenger-mcp"
version = "0.1.0"
description = "Local MCP tools for a personal Telegram account and LM Studio"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "Telethon==1.45.0",
    "python-dotenv>=1.1,<2",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
personal-mcp = "personal_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
